# Pre-commit hooks for the codEx slim patch-queue repository.
#
# These are the local tiers of the CI gates, not a reimplementation of them:
# every hook routes through scripts/gates.sh, the same runner CI calls, so a
# local pass is a CI pass. The tiers mirror the remote ones exactly:
#
#   commit   -> scripts/gates.sh light   (no patch list, no bootstrap: seconds)
#   pre-push -> scripts/gates.sh heavy   (the bootstrapped tree: queue
#                                         integrity, compile surface, rustfmt,
#                                         release build, TUI and core suites)
#
# Install with:
#
#   pip install pre-commit
#   pre-commit install                       # commit hook: the light gate
#   pre-commit install --hook-type pre-push  # push hook: the heavy gate
#
# Requirements:
#   - python3 (the light gate runs upstream's asciicheck.py, carried in
#     scripts/)
#   - codespell, or uv (the light gate falls back to uvx codespell==2.4.3)
#   - a bootstrapped tree for the push hook: bash scripts/bootstrap.sh
#   - cargo-nextest for the push hook: cargo install --locked cargo-nextest
#
# The heavy hook is deliberately slow (tens of minutes). That is the point:
# the local tier runs first, so a broken push never reaches remote CI. Use
# `git push --no-verify` when you knowingly want to skip it.

repos:
  - repo: local
    hooks:
      - id: gates-light
        name: Local light gate (scripts/gates.sh light)
        description: The checks CI blocks a pull request on, run before the commit lands
        entry: bash
        language: system
        pass_filenames: false
        always_run: true
        args:
          - scripts/gates.sh
          - light

      - id: gates-heavy
        name: Local heavy gate (scripts/gates.sh heavy)
        description: The checks CI runs post-merge, run before the push leaves the machine
        entry: bash
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        args:
          - scripts/gates.sh
          - heavy
