# Pre-commit hooks for the codEx slim patch-queue repository.
#
# These are lightweight local checks; the blocking CI remains the enforced
# gate and still runs the same checks. Install with:
#
#   pip install pre-commit
#   pre-commit install
#
# The cargo-fmt hook only runs when a bootstrapped tree exists (tree/), which
# is where the actual Rust sources live.

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [-I, .codespellignore]

  - repo: local
    hooks:
      - id: readme-asciicheck
        name: README ASCII check
        description: Mirrors the CI asciicheck rule (ASCII plus U+2728)
        entry: python3
        language: system
        files: ^README\.md$
        args:
          - -c
          - |
            import sys
            path = "README.md"
            allowed = {0x2728}
            data = open(path, encoding="utf-8").read()
            bad = sorted({c for c in data if ord(c) > 127 and ord(c) not in allowed})
            if bad:
                print(f"{path}: non-ASCII characters: {[hex(ord(c)) for c in bad]}")
                sys.exit(1)

      - id: patch-module-check
        name: Patch module layout check
        description: Validates the module patch queue against scripts/patch-modules.conf
        entry: bash
        language: system
        files: ^(patches/.*\.patch|BASE_TAG|scripts/patch-modules\.conf|scripts/check-patch-modules\.sh|scripts/gen-patches\.sh|scripts/update\.sh)$
        pass_filenames: false
        args:
          - -c
          - |
            tree_args=()
            if [[ -d tree ]]; then
              tree_args=(--tree tree)
            fi
            bash scripts/check-patch-modules.sh "${tree_args[@]}" --patches patches

      - id: cargo-fmt
        name: cargo fmt --check (bootstrapped tree)
        description: Runs rustfmt when a bootstrapped tree exists under tree/
        entry: bash
        language: system
        pass_filenames: false
        always_run: true
        args:
          - -c
          - |
            if [ -d tree/codex-rs ]; then
              cd tree/codex-rs && cargo fmt --check
            fi
