name: bootstrap-tree
description: >-
  Resolve the bootstrapped tree root and export TREE_DIR/CODE_DIR so every
  check job runs in the same place. Works both in the full fork checkout
  (codex-rs/ present) and in the slim patch-queue repo, where the tree is
  rebuilt from BASE_TAG plus patches/.

outputs:
  tree-dir:
    description: Path to the tree root, relative to the workspace (. or tree).
    value: ${{ steps.resolve.outputs.tree-dir }}
  code-dir:
    description: Path to the Cargo workspace (codex-rs or tree/codex-rs).
    value: ${{ steps.resolve.outputs.code-dir }}
  bootstrapped:
    description: Whether this step cloned the tree from the queue.
    value: ${{ steps.resolve.outputs.bootstrapped }}

runs:
  using: composite
  steps:
    # Upstream's shared setup-ci action sets this on Windows; the v8 git
    # dependency checks out chromium submodules whose paths exceed the
    # 260-character limit without it.
    - name: Enable Git long paths (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.longpaths true

    - name: Configure CI build paths
      shell: bash
      run: |
        set -euo pipefail
        # Upstream's setup-ci action redirects the Cargo target directory to a
        # dedicated build root. The GitHub-hosted runner's default location
        # shares the ~14 GB workspace disk with the checkout, and a release
        # build of this workspace plus the tree's dependencies fills it
        # ("rustc-LLVM ERROR: IO failure ... No space left on device").
        build_root="$HOME/.cache/codex-ci"
        cargo_target_dir="$build_root/cargo-target"
        mkdir -p "$cargo_target_dir"
        echo "CARGO_TARGET_DIR=${cargo_target_dir}" >> "$GITHUB_ENV"

    - name: Resolve or bootstrap the tree
      id: resolve
      shell: bash
      run: |
        set -euo pipefail

        tree_dir="."
        code_dir="codex-rs"
        bootstrapped=false
        if [[ ! -d "${code_dir}" ]]; then
          # Slim patch-queue repo: rebuild the full tree from BASE_TAG + patches/.
          tree_dir="tree"
          code_dir="tree/codex-rs"
          bash scripts/bootstrap.sh "${tree_dir}"
          bootstrapped=true
        fi

        {
          echo "tree-dir=${tree_dir}"
          echo "code-dir=${code_dir}"
          echo "bootstrapped=${bootstrapped}"
        } >> "$GITHUB_OUTPUT"
        {
          echo "TREE_DIR=${tree_dir}"
          echo "CODE_DIR=${code_dir}"
        } >> "$GITHUB_ENV"
