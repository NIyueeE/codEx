# Release workflow for the codEx fork (Linux musl and Windows MSVC, CLI only).
#
# Works both in the full fork checkout (codex-rs/ present) and in the slim
# patch-queue repo (patches/ + scripts/ only): when codex-rs/ is missing the
# tree is bootstrapped from upstream via scripts/bootstrap.sh.
#
# Publishes standalone binaries from a `rust-v<semver>` or `v<semver>` tag.
# Each target ships:
#   codex-<target>.tar.gz        (contains `codex` at the archive root, plus
#                                 `bwrap` for the Linux sandbox helper and the
#                                 Windows helper binaries under
#                                 `codex-resources/`)
#   codex-<target>.tar.gz.sha256 (sha256 of the archive)
# which `codex update` downloads and verifies.

name: rust-release

on:
  push:
    tags:
      - "rust-v*"
      - "v*"

concurrency:
  # Tag re-pushes supersede stale release runs (e.g. after force-updating the
  # release tag during an iteration), so never queue behind an old run. The
  # group is scoped to the ref so building one tag never cancels another tag's
  # release, and a cancellation can never land between delete and create.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap tree if needed
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo . || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"
      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          cd "${CODE_DIR}"
          echo "::group::Tag validation"

          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "❌  Not a tag ref"; exit 1; }

          version="${GITHUB_REF_NAME#rust-v}"
          version="${version#v}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "❌  Tag '${GITHUB_REF_NAME}' doesn't match expected format"; exit 1; }

          cargo_ver="$(grep -m1 '^version' Cargo.toml \
                        | sed -E 's/version *= *"([^"]+)".*/\1/')"

          [[ "${version}" == "${cargo_ver}" ]] \
            || { echo "❌  Tag ${version} ≠ Cargo.toml ${cargo_ver}"; exit 1; }

          echo "✅  Tag and Cargo.toml agree (${version})"
          echo "::endgroup::"

  build:
    needs: tag-check
    name: Build - ${{ matrix.target }}
    # Windows release builds can exceed an hour, so the timeout matches the
    # Linux budget rather than dropping back to the default.
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Use the git CLI instead of Cargo's libgit2 path for git dependencies.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Avoid problematic aws-lc jitter entropy code path on musl builders.
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      AWS_LC_SYS_NO_JITTER_ENTROPY_AARCH64_UNKNOWN_LINUX_MUSL: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs_on: ubuntu-24.04
            platform: linux
          - target: x86_64-pc-windows-msvc
            runs_on: windows-2022
            platform: windows

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap tree if needed
        shell: bash
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo . || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # ---- Linux musl toolchain -------------------------------------------
      - name: Install Zig
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: matrix.platform == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${TREE_DIR}/.github/scripts/install-musl-build-tools.sh"

      # ---- Windows MSVC toolchain -----------------------------------------
      # Reuse upstream's MSVC helper, which resolves the Visual Studio
      # installation for the target architecture and exports the LIB/INCLUDE/
      # PATH variables the linker needs. It is invoked through TREE_DIR
      # instead of `uses:` because the helper only exists inside the
      # bootstrapped tree, while the workflow may also run from the full fork
      # checkout where the tree is the repository root.
      - name: Expose MSVC SDK environment
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          & "$env:TREE_DIR/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"

      # ---- rusty_v8 prebuilt artifacts (both platforms) --------------------
      # The fork reuses the upstream openai/codex rusty-v8 release assets. Both
      # platforms verify the downloaded checksum manifest against the manifest
      # committed under third_party/v8 before trusting its contents.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        if: matrix.platform == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "${TREE_DIR}"
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          profile="ptrcomp_sandbox_release"
          archive_name="librusty_v8_${profile}_${TARGET}.a.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${binding_dir}/${archive_name}"
          binding_path="${binding_dir}/${binding_name}"
          checksums_path="${binding_dir}/${checksums_name}"
          trusted_checksums="third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          # The manifest is authoritative only after its bytes match the copy
          # pinned in this repository.
          expected_manifest_checksum="$(grep -F "  ${checksums_name}" "${trusted_checksums}" | cut -d ' ' -f 1)"
          actual_manifest_checksum="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "${checksums_path}")"
          if [[ "${actual_manifest_checksum}" != "${expected_manifest_checksum}" ]]; then
            echo "Checksum mismatch for ${checksums_name}: expected ${expected_manifest_checksum}, got ${actual_manifest_checksum}" >&2
            exit 1
          fi
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      - name: Configure rusty_v8 artifact overrides (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "${TREE_DIR}"
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          profile="ptrcomp_sandbox_release"
          # MSVC artifacts are static libraries, hence the `.lib.gz` naming.
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${binding_dir}/${archive_name}"
          binding_path="${binding_dir}/${binding_name}"
          checksums_path="${binding_dir}/${checksums_name}"
          trusted_checksums="third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          # Windows-built release manifests use CRLF line endings, so verify the
          # original manifest bytes against the trusted checksum list first.
          expected_manifest_checksum="$(grep -F "  ${checksums_name}" "${trusted_checksums}" | cut -d ' ' -f 1)"
          actual_manifest_checksum="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "${checksums_path}")"
          if [[ "${actual_manifest_checksum}" != "${expected_manifest_checksum}" ]]; then
            echo "Checksum mismatch for ${checksums_name}: expected ${expected_manifest_checksum}, got ${actual_manifest_checksum}" >&2
            exit 1
          fi
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
          if [[ "$(wc -l < "${checksums_path}")" -ne 2 ]]; then
            echo "Expected exactly two checksums for ${TARGET} in ${checksums_path}" >&2
            exit 1
          fi
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"

      # ---- Build -----------------------------------------------------------
      - name: Build bwrap and export digest
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "${CODE_DIR}"
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --bin bwrap

          bwrap_path="target/${target}/release/bwrap"
          if [[ ! -f "$bwrap_path" ]]; then
            echo "bwrap binary ${bwrap_path} not found"
            exit 1
          fi

          # Codex embeds this digest at build time and verifies the bundled
          # bwrap resource before use. Strip bwrap before hashing so the digest
          # covers the exact bytes that the release packages.
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      - name: Build codex
        shell: bash
        env:
          # Mirrors upstream: SQLite intrinsics miscompile for x64 MSVC.
          LIBSQLITE3_FLAGS: ${{ matrix.platform == 'windows' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
        run: |
          cd "${CODE_DIR}"
          cargo build --target "${{ matrix.target }}" --release --bin codex

      # Upstream ships every one of these inside `bin/` or `codex-resources/`;
      # a canonical package is rejected when one is missing. bwrap is built and
      # digested separately above.
      - name: Build helper binaries
        shell: bash
        env:
          LIBSQLITE3_FLAGS: ${{ matrix.platform == 'windows' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
        run: |
          cd "${CODE_DIR}"
          target="${{ matrix.target }}"
          helpers=(--bin codex-code-mode-host)
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            helpers+=(--bin codex-windows-sandbox-setup --bin codex-command-runner)
          fi
          cargo build --target "$target" --release "${helpers[@]}"

      # Cargo keeps release binaries symbolicateable until packaging has
      # archived their symbols; see the `[profile.release]` comment in
      # codex-rs/Cargo.toml. Strip before assembling the package so the
      # published payload is the stripped one.
      - name: Build symbols archive and strip binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd "${CODE_DIR}"
          binaries="codex codex-code-mode-host"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            binaries+=" codex-windows-sandbox-setup codex-command-runner"
          fi
          bash "${TREE_DIR}/.github/scripts/archive-release-symbols-and-strip-binaries.sh" \
            --target "$TARGET" \
            --artifact-name "$TARGET" \
            --release-dir "target/${TARGET}/release" \
            --archive-dir "${GITHUB_WORKSPACE}/symbols-dist/${TARGET}" \
            --binaries "$binaries"

      # ---- Package ---------------------------------------------------------
      # Upstream's canonical layout: `codex-package.json` plus `bin/`,
      # `codex-resources/`, and `codex-path/` at the archive root. `install.sh`
      # expands it into a standalone release, `codex update` swaps its members,
      # and app-server-daemon copies it whole when it installs the daemon.
      - name: Assemble package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd "${CODE_DIR}"
          tree_dir="$(cd "${TREE_DIR}" && pwd)"
          release_dir="target/${TARGET}/release"
          [[ -f "${release_dir}/codex" || -f "${release_dir}/codex.exe" ]] || {
            echo "codex binary not found in ${release_dir}"
            exit 1
          }

          archive_stem="${GITHUB_WORKSPACE}/symbols-dist/${TARGET}/codex-symbols-${TARGET}.tar.gz"
          symbols_args=()
          if [[ -f "$archive_stem" ]]; then
            symbols_args=(--symbols-archive "$archive_stem")
          fi

          version="$(grep -m1 '^version' "${tree_dir}/codex-rs/Cargo.toml" | sed -E 's/.*"(.*)".*/\1/')"
          dest="${GITHUB_WORKSPACE}/dist/${TARGET}"
          mkdir -p "$dest"

          package_args=(
            --target "$TARGET"
            --variant codex
            --package-version "$version"
            --cargo-profile release
            --package-dir "${RUNNER_TEMP}/codex-package-${TARGET}"
            --archive-output "${dest}/codex-${TARGET}.tar.gz"
            --force
          )

          if [[ "$PLATFORM" == "linux" ]]; then
            [[ -f "${release_dir}/bwrap" ]] || { echo "bwrap binary not found"; exit 1; }
            package_args+=(
              --code-mode-host-bin "${release_dir}/codex-code-mode-host"
              --bwrap-bin "${release_dir}/bwrap"
            )
          else
            package_args+=(
              --code-mode-host-bin "${release_dir}/codex-code-mode-host.exe"
              --codex-command-runner-bin "${release_dir}/codex-command-runner.exe"
              --codex-windows-sandbox-setup-bin "${release_dir}/codex-windows-sandbox-setup.exe"
            )
          fi

          # The builder fetches ripgrep (and, on Unix, the patched zsh) from
          # upstream's pinned DotSlash manifests.
          export CODEX_REPO_ROOT="$tree_dir"
          python3 "${tree_dir}/scripts/build_codex_package.py" "${package_args[@]}"

          sha256sum "${dest}/codex-${TARGET}.tar.gz" | \
            awk '{print $1 "  codex-'${TARGET}'.tar.gz"}' \
            > "${dest}/codex-${TARGET}.tar.gz.sha256"

          # The package must be exactly what the running CLI accepts, or the
          # daemon silently falls back to rejecting the local package.
          python3 - "${RUNNER_TEMP}/codex-package-${TARGET}" "$PLATFORM" <<'PY'
          import json, sys
          from pathlib import Path

          package = Path(sys.argv[1])
          windows = sys.argv[2] == "windows"
          suffix = ".exe" if windows else ""
          manifest = json.loads((package / "codex-package.json").read_text(encoding="utf-8"))
          assert manifest["layoutVersion"] == 1, manifest
          assert manifest["entrypoint"] == f"bin/codex{suffix}", manifest

          required = [
              f"bin/codex{suffix}",
              f"bin/codex-code-mode-host{suffix}",
              f"codex-path/rg{suffix}",
          ]
          if windows:
              required += [
                  "codex-resources/codex-command-runner.exe",
                  "codex-resources/codex-windows-sandbox-setup.exe",
              ]
          else:
              required += ["codex-resources/bwrap", "codex-resources/zsh/bin/zsh"]

          missing = [name for name in required if not (package / name).is_file()]
          if missing:
              raise SystemExit(f"packaged files are missing: {missing}")
          print(f"package OK: {manifest['version']} {manifest['target']} {manifest['entrypoint']}")
          PY

      - name: Upload archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

      # Debug symbols for the stripped payload, so a crash report from a
      # released binary stays symbolicateable. bwrap is hashed after stripping,
      # so its symbols are not part of this archive.
      - name: Upload symbols archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}-symbols
          path: symbols-dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.sha256)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no release assets found under dist/" >&2
            exit 1
          fi
          # Tag re-pushes supersede earlier builds; replace the previous
          # release's assets instead of deleting the release, so a failed or
          # cancelled run can never leave the tag without a release.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; replacing its assets with the new build."
          else
            gh release create "${tag}" \
                --title "codEx ${tag}" \
                --notes "codEx ${tag} (fork of openai/codex at the matching upstream tag)"
          fi
          gh release upload "${tag}" "${assets[@]}" --clobber
