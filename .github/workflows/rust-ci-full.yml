name: rust-ci-full

# The second half of the fork's heavy gate: the release CLI build and the full
# codex-tui / codex-core suites (plus the native Windows type-check, which only
# a Windows runner can do). Tens of minutes, which is why it is deliberately
# not part of the merge gate -- the light gate in blocking-ci.yml is.
#
# Upstream's rust-ci-full.yml is the model. The fork narrows it to Linux +
# Windows and drives every check through scripts/gates.sh, so the local
# `pre-push` hook runs the same commands, with the same memory ceilings and
# nextest profile, before a push leaves the machine.
#
# Reachable the upstream way:
#   - after a merge, through postmerge-ci.yml
#   - on demand, through workflow_dispatch or a `**full-ci**` branch
#   - locally, through `bash scripts/gates.sh full` (tree checks too: `heavy`)
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**full-ci**"

jobs:
  build:
    name: Release build
    runs-on: ubuntu-24.04
    # The release link with thin LTO is the single most expensive step here.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap-tree
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/cargo-cache
        with:
          key: rust-ci-full-build
      - name: Build release CLI
        run: bash scripts/gates.sh full --only release-build --tree "${TREE_DIR}" --fast-fail
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-tui:
    name: TUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap-tree
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/cargo-cache
        with:
          key: rust-ci-full-test-tui
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          # The cargo cache restores ~/.cargo/bin, and `cargo install` refuses
          # to overwrite an existing binary ("already exists in destination"),
          # so only install what the cache did not provide. The version is
          # pinned because an unpinned install picks up whatever the registry
          # published last, which is how this step first failed a rerun.
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest --version
            exit 0
          fi
          cargo install --locked cargo-nextest@0.9.146
      - name: Run codex-tui tests
        run: bash scripts/gates.sh full --only tui-tests --tree "${TREE_DIR}" --fast-fail
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  test-core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap-tree
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: ./.github/actions/cargo-cache
        with:
          key: rust-ci-full-test-core
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          # The cargo cache restores ~/.cargo/bin, and `cargo install` refuses
          # to overwrite an existing binary ("already exists in destination"),
          # so only install what the cache did not provide. The version is
          # pinned because an unpinned install picks up whatever the registry
          # published last, which is how this step first failed a rerun.
          if command -v cargo-nextest >/dev/null 2>&1; then
            cargo nextest --version
            exit 0
          fi
          cargo install --locked cargo-nextest@0.9.146
      # The sandbox-dependent core integration suite (suite::*) needs
      # sandbox-capable runners, exactly like upstream, which runs it on
      # self-hosted runners only. Hosted CI covers core unit tests; gates.sh
      # excludes the same tests.
      - name: Run codex-core tests
        run: bash scripts/gates.sh full --only core-tests --tree "${TREE_DIR}" --fast-fail
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  check-windows:
    name: Windows check
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap-tree
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Expose MSVC SDK environment
        shell: pwsh
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          & "$env:TREE_DIR/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"
      - name: Configure rusty_v8 artifact overrides (Windows)
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          set -euo pipefail
          cd "${TREE_DIR}"
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          profile="ptrcomp_sandbox_release"
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${binding_dir}/${archive_name}"
          binding_path="${binding_dir}/${binding_name}"
          checksums_path="${binding_dir}/${checksums_name}"
          trusted_checksums="third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          expected_manifest_checksum="$(grep -F "  ${checksums_name}" "${trusted_checksums}" | cut -d ' ' -f 1)"
          actual_manifest_checksum="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "${checksums_path}")"
          if [[ "${actual_manifest_checksum}" != "${expected_manifest_checksum}" ]]; then
            echo "Checksum mismatch for ${checksums_name}: expected ${expected_manifest_checksum}, got ${actual_manifest_checksum}" >&2
            exit 1
          fi
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"
      # The workspace patches `v8` to a git checkout of the rusty_v8 fork, and
      # cargo initialises that repository's chromium submodules while checking
      # it out. Their vendored crate paths exceed Windows' 260-character limit,
      # so the checkout dies with ENAMETOOLONG before anything compiles.
      #
      # GitHub's source tarball carries the crate without submodule contents,
      # and the prebuilt artifacts above are what its build script consumes, so
      # pointing the patch at that source keeps the type-check faithful while
      # removing the submodule fetch entirely.
      - name: Vendor the v8 crate source for the type-check
        shell: bash
        run: |
          set -euo pipefail
          rev=350c5a859a9b3c84ab8701b3ad51e3b7699b30c0
          curl -fsSL "https://github.com/seanh-oai/rusty_v8/archive/${rev}.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}"
          echo "V8_SOURCE_DIR=${RUNNER_TEMP}/rusty_v8-${rev}" >> "${GITHUB_ENV}"
      # Belt and braces for the case where cargo still resolves the `v8` git
      # dependency (a cached lock or a future crate pulling it in): its
      # chromium submodules exceed the Windows 260-character limit, and git
      # only uses the extended-length path API when core.longpaths is set.
      - name: Enable long paths for any remaining v8 git checkout
        shell: bash
        run: git config --global core.longpaths true
      # Type-check the Windows-only code paths (self-update swap, sandbox
      # helpers) on a native runner. Cross-checking from Linux is impossible
      # because ring/aws-lc-sys build scripts need a Windows C toolchain.
      # `--tests` keeps the Windows test code and every
      # `cfg(not(target_os = "windows"))` item compiled, so the Unix updater
      # path cannot rot unseen.
      #
      # These two calls are the only gate commands that cannot go through
      # scripts/gates.sh: the local gate has no Windows runner, and a
      # `cargo check --target` with the MSVC environment is not something a
      # Linux host can reproduce. They are the Windows half of the compile
      # surface that `gates.sh tree` checks on Linux.
      - name: Type-check the CLI for Windows
        shell: bash
        run: |
          cd "${CODE_DIR}"
          cargo check --target x86_64-pc-windows-msvc -p codex-cli --tests \
            --config "patch.crates-io.v8.path='${V8_SOURCE_DIR}'"
      - name: Type-check the TUI for Windows
        shell: bash
        run: |
          cd "${CODE_DIR}"
          cargo check --target x86_64-pc-windows-msvc -p codex-tui \
            --config "patch.crates-io.v8.path='${V8_SOURCE_DIR}'"
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  # The gatherer: only an explicit success from every above is safe to accept.
  results:
    name: Full CI results
    needs:
      - build
      - test-tui
      - test-core
      - check-windows
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
