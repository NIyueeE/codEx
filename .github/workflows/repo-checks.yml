name: repo-checks

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Bootstrap tree if needed
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree)" >> "$GITHUB_ENV"

      - name: Verify codex-rs Cargo manifests inherit workspace settings
        run: python3 "${TREE_DIR}/.github/scripts/verify_cargo_workspace_manifests.py"

      - name: Verify codex-tui does not import codex-core directly
        run: python3 "${TREE_DIR}/.github/scripts/verify_tui_core_boundary.py"

      - name: Test Codex package builder
        run: python3 -m unittest discover -s "${TREE_DIR}/scripts/codex_package" -p 'test_*.py'

      - name: Ensure root README.md contains only ASCII and certain Unicode code points
        if: hashFiles('README.md') != ''
        run: python3 "${TREE_DIR}/scripts/asciicheck.py" README.md

      - name: Check formatting (run `cargo fmt` to fix)
        run: |
          cd "${TREE_DIR}"
          cargo fmt --check

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
