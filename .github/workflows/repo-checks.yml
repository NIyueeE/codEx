name: repo-checks

# The fork's light gate: everything that can be checked without applying the
# patch queue. It needs no bootstrapped tree and no Cargo, so it costs seconds
# and is the only thing that blocks a pull request (`blocking-ci.yml`).
#
# It covers:
#   - the exported queue's shape (one patch per module, in order, with the
#     manifest's subjects and file ownership)
#   - the docs (README ASCII, README.zh typography)
#   - spelling and shell linting
#
# The blob-size policy runs as its own sibling job (blob-size-policy.yml), and
# everything that needs the tree lives in the heavy tier: rust-ci.yml for the
# queue's invariants and the compile surface, rust-ci-full.yml for the release
# build and the suites.
#
# Upstream's own repo-checks.yml is the model for this file; the fork drops the
# Node/Bazel/Bazel-lint steps it does not carry and routes every remaining check
# through scripts/gates.sh so the local commit hook runs exactly the same
# commands.
on:
  workflow_call:

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # gates.sh runs codespell through uvx when no system codespell exists, so
      # CI and the local hook pin the same version (2.4.3). Upstream's
      # repo-checks.yml installs uv the same way.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"

      # shellcheck ships with the hosted image, but the gate skips it silently
      # when it is missing, so install it explicitly rather than let a runner
      # image change weaken the gate unnoticed.
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # The repo half of the light gate. `--skip blob-size,codespell` because
      # blob-size-policy.yml and codespell.yml own those checks as their own
      # jobs, all three running the same scripts/gates.sh implementation.
      - name: Run the light gate
        run: bash scripts/gates.sh light --skip blob-size,codespell --fast-fail

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
