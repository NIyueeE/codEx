name: blocking-ci

# Single entrypoint for checks that block a PR merge. The codEx fork uses a
# Cargo-only CI: build the CLI, check formatting, and run the TUI/core tests.
# Works both in the full fork checkout and in the slim patch-queue repo (the
# tree is bootstrapped from upstream when codex-rs/ is absent).
on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap tree if needed
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"
      - name: Enable unprivileged user namespaces (Linux)
        run: |
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.unprivileged_userns_clone'; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Build release CLI
        run: |
          cd "${CODE_DIR}"
          cargo build --release --bin codex
      - name: Check formatting
        run: |
          cd "${CODE_DIR}"
          cargo fmt --check

  test-tui:
    name: TUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap tree if needed
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"
      - name: Enable unprivileged user namespaces (Linux)
        run: |
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.unprivileged_userns_clone'; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run codex-tui tests
        run: |
          cd "${CODE_DIR}"
          cargo install --locked cargo-nextest
          RUST_MIN_STACK=8388608 NEXTEST_PROFILE=local cargo nextest run --no-fail-fast -p codex-tui

  test-core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap tree if needed
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"
      - name: Enable unprivileged user namespaces (Linux)
        run: |
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.unprivileged_userns_clone'; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Run codex-core tests
        run: |
          cd "${CODE_DIR}"
          cargo install --locked cargo-nextest
          # The full core integration suite (sandbox/approvals scenarios) needs
          # sandbox-capable runners, exactly like upstream, which runs it on
          # self-hosted runners only. Hosted CI covers core unit tests; the
          # sandbox-dependent `suite::*` tests are excluded here.
          RUST_MIN_STACK=8388608 NEXTEST_PROFILE=local cargo nextest run --no-fail-fast \
            -p codex-core -E 'not test(suite)'

  check-windows:
    name: Windows check
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Bootstrap tree if needed
        shell: bash
        run: |
          if [[ ! -d codex-rs ]]; then
            bash scripts/bootstrap.sh
          fi
          echo "TREE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree)" >> "$GITHUB_ENV"
          echo "CODE_DIR=$([[ -d codex-rs ]] && echo codex-rs || echo tree/codex-rs)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Expose MSVC SDK environment
        shell: pwsh
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          & "$env:TREE_DIR/.github/actions/setup-msvc-env/setup-msvc-env.ps1" -Target "$env:TARGET"
      - name: Configure rusty_v8 artifact overrides (Windows)
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          set -euo pipefail
          cd "${TREE_DIR}"
          version="$(python3 .github/scripts/rusty_v8_bazel.py resolved-v8-crate-version)"
          release_tag="rusty-v8-v${version}"
          base_url="https://github.com/openai/codex/releases/download/${release_tag}"
          binding_dir="${RUNNER_TEMP}/rusty_v8"
          profile="ptrcomp_sandbox_release"
          archive_name="rusty_v8_${profile}_${TARGET}.lib.gz"
          binding_name="src_binding_${profile}_${TARGET}.rs"
          checksums_name="rusty_v8_${profile}_${TARGET}.sha256"
          archive_path="${binding_dir}/${archive_name}"
          binding_path="${binding_dir}/${binding_name}"
          checksums_path="${binding_dir}/${checksums_name}"
          trusted_checksums="third_party/v8/rusty_v8_${version//./_}_release_manifests.sha256"
          mkdir -p "${binding_dir}"
          curl -fsSL "${base_url}/${checksums_name}" -o "${checksums_path}"
          expected_manifest_checksum="$(grep -F "  ${checksums_name}" "${trusted_checksums}" | cut -d ' ' -f 1)"
          actual_manifest_checksum="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "${checksums_path}")"
          if [[ "${actual_manifest_checksum}" != "${expected_manifest_checksum}" ]]; then
            echo "Checksum mismatch for ${checksums_name}: expected ${expected_manifest_checksum}, got ${actual_manifest_checksum}" >&2
            exit 1
          fi
          curl -fsSL "${base_url}/${archive_name}" -o "${archive_path}"
          curl -fsSL "${base_url}/${binding_name}" -o "${binding_path}"
          (cd "${binding_dir}" && tr -d '\r' < "${checksums_path}" | sha256sum -c -)
          echo "RUSTY_V8_ARCHIVE=${archive_path}" >> "${GITHUB_ENV}"
          echo "RUSTY_V8_SRC_BINDING_PATH=${binding_path}" >> "${GITHUB_ENV}"
      # Type-check the Windows-only code paths (self-update swap, sandbox
      # helpers) on a native runner. Cross-checking from Linux is impossible
      # because ring/aws-lc-sys build scripts need a Windows C toolchain.
      - name: Type-check the CLI for Windows
        shell: bash
        run: |
          cd "${CODE_DIR}"
          cargo check --target x86_64-pc-windows-msvc -p codex-cli
      - name: Type-check the TUI for Windows
        shell: bash
        run: |
          cd "${CODE_DIR}"
          cargo check --target x86_64-pc-windows-msvc -p codex-tui

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - build
      - test-tui
      - test-core
      - check-windows
      - codespell
      - repo-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
