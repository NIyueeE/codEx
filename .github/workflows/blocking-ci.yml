name: blocking-ci

# The single entrypoint for the checks that block a pull-request merge.
#
# The fork is a patch-queue repository: its product is the queue in patches/,
# and applying that queue (scripts/bootstrap.sh) is the expensive part of CI.
# The gates are therefore tiered by whether they need the queue applied:
#
#   light  (this workflow, blocking)   no patch list, no bootstrap: the queue's
#                                      exported shape, the docs, spelling,
#                                      shell linting, the changed-blob budget.
#                                      Seconds, and it runs on every PR.
#   heavy  (postmerge-ci.yml)          the bootstrapped tree: queue integrity,
#                                      the export drift check, the Python
#                                      suites, the compile surface, rustfmt,
#                                      cargo-deny, the release build, and the
#                                      codex-tui / codex-core suites.
#
# That is upstream's shape (a light rust-ci on a PR, a full rust-ci-full after
# the merge) narrowed to Linux + Windows: the fork carries no bootstrap-free
# Cargo check, so its Cargo work all lives in the heavy tier, and the local
# pre-push hook runs the same heavy tier before a push leaves the machine.
#
# Every check is implemented once, in scripts/gates.sh, and the jobs below only
# select a tier of it.
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - blob-size-policy
      - codespell
      - repo-checks
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
